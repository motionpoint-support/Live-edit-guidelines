@keyframes march{to{stroke-dashoffset:-72}}
@keyframes arc{from{stroke-dashoffset:302}to{stroke-dashoffset:0}}

<!-- ============ SCENE 0 · INTRO ============ -->
<template id="scene-0">
<div style="position: absolute; left: 0; top: 72px; width: 1280px; height: 648px;">
<div style="position: absolute; left: 0; top: 24px; width: 1280px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;"><div style="font-size: 16px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: #3E8A2A; animation: up .8s .4s both;">Customer Support &middot; New Agent Training</div><h1 class="disp" style="margin: 0; font-size: 60px; line-height: 1.05; font-weight: 700; color: #0B2545; animation: up .9s .9s both;">Live Edit</h1><p style="margin: 0; font-size: 23px; color: #3B4F6B; max-width: 1000px; animation: up .9s 1.6s both;">The customer&rsquo;s tool to send feedback, or edit their translated site directly.</p></div>
<div style="position: absolute; left: 40px; top: 220px; width: 380px; height: 180px; border-radius: 16px; background: #DCE7F7; border: 3px solid #1466F0; padding: 14px 18px; display: flex; flex-direction: column; justify-content: center; gap: 6px; animation: pop .55s 5s both;"><span class="eb" style="color: #1466F0;">What</span><span style="font-size: 17px; font-weight: 700; color: #0B2545; line-height: 1.4;">A browser-based tool in ControlCenter to send feedback to MotionPoint or edit translations on the live translated site.</span></div>
<div style="position: absolute; left: 450px; top: 220px; width: 380px; height: 180px; border-radius: 16px; background: #FCE3CC; border: 3px solid #C2410C; padding: 14px 18px; display: flex; flex-direction: column; justify-content: center; gap: 6px; animation: pop .55s 9s both;"><span class="eb" style="color: #C2410C;">Why you need it</span><span style="font-size: 17px; font-weight: 700; color: #0B2545; line-height: 1.4;">Customers use it every day. You need to know what it does to answer their questions.</span></div>
<div style="position: absolute; left: 860px; top: 220px; width: 380px; height: 180px; border-radius: 16px; background: #E5F4DE; border: 3px solid #2F7A22; padding: 14px 18px; display: flex; flex-direction: column; justify-content: center; gap: 6px; animation: pop .55s 13s both;"><span class="eb" style="color: #2F7A22;">Who uses it</span><span style="font-size: 17px; font-weight: 700; color: #0B2545; line-height: 1.4;">Customer users with a Live Edit role: Reviewers send feedback; Editors send feedback and make edits.</span></div>
<div style="position: absolute; left: 160px; top: 436px; width: 960px; height: 104px; border-radius: 20px; background: #0B2545; color: #FFFFFF; display: flex; align-items: center; gap: 18px; padding: 0 30px; animation: up .7s 19s both;"><svg width="40" height="40" style="flex-shrink: 0; color: #F6C453;"><use href="#dc-warn"></use></svg><span style="font-size: 21px; font-weight: 900; line-height: 1.4;">A saved edit goes live right away, and changes every identical segment.</span></div>
</div>

<!-- ============ SCENE 1 · GETTING AROUND ============ -->
<template id="scene-1">
<div style="position: absolute; left: 0; top: 72px; width: 1280px; height: 648px;">
<div class="sh" style="animation: up .6s .2s both;"><div class="h2">Part 1: Getting around Live Edit</div><div class="h2s">Where it is, and what&rsquo;s on screen.</div></div>
<div class="sc" style="left: 40px; width: 592px; background: #DCE7F7; color: #1466F0; animation: up .6s 1.4s both, litRing 18s 4s both;"><div class="sr"><span class="sn" style="background: #1466F0;">1</span><span class="tg" style="background: #1466F0;">ControlCenter</span></div><div class="st">Four areas</div><svg class="mk" width="28" height="28" style="animation: pop .5s 21.4s both;"><use href="#dc-check"></use></svg></div>
<div class="sc" style="left: 648px; width: 592px; background: #DCE7F7; color: #1466F0; animation: up .6s 1.6s both, litRing 18s 22s both;"><div class="sr"><span class="sn" style="background: #1466F0;">2</span><span class="tg" style="background: #1466F0;">Features</span></div><div class="st">The toolbar</div><svg class="mk" width="28" height="28" style="animation: pop .5s 39.4s both;"><use href="#dc-check"></use></svg></div>
<div class="panel" style="animation: up .7s 2.2s both;">

<script>
const STEP_HTML = "<div style=\"height: 52px; padding: 0 18px 0 6px; border-radius: 26px; background: #0B2545; color: #FFFFFF; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 16px rgba(11,37,69,.22); animation: pop 0.78s ease both;\">\n<span class=\"disp\" style=\"width: 40px; height: 40px; border-radius: 20px; background: #5DB645; color: #0B2545; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700;\">{{st.n}}</span>\n<span style=\"font-size: 15px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase;\">Part {{st.n}} of 7</span>\n</div>";
const SUB_OPEN = "<div style=\"position: absolute; left: 48px; right: 48px; top: 0; height: 70px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 22px; line-height: 1.3; font-weight: 700; color: #F4F7FB; animation: up 0.7s ease both;\">";
function fit(){ const s = Math.min(window.innerWidth / 1280, window.innerHeight / 870); document.getElementById('fit').style.transform = 'scale(' + s + ')'; }
window.addEventListener('resize', fit); fit();
class Player {
  constructor() {
    this.state = { scene: 0, el: 0, playing: false, started: false, ended: false, music: true, subsOn: true };
    this.ctx = null;
  }
  durs() { return [26000, 42000, 60000, 60000, 60000, 40000, 44000, 90000]; }
  subLines() {
    return [[[0, "Welcome! This video covers Live Edit."], [5000, "Live Edit is a browser-based tool in ControlCenter. Customers use it to send feedback to MotionPoint, or to edit translations on their live translated site."], [9000, "Customers use it every day, so you need to know what it does to answer their questions."], [13000, "There are two roles: Reviewers send feedback. Editors send feedback and make edits."], [19000, "Keep this in mind: a saved edit goes live right away, and changes every identical segment."]],
      [[0, "Part 1: getting around Live Edit."], [4000, "Live Edit is in ControlCenter, at control dot motionpoint dot com. It runs in a browser like Chrome or Firefox."], [7000, "There are four main areas at the top: Navigate your site, Edit content segments, view reports on the Dashboard, and set up pages for review."], [12000, "Customers who need a login can ask their CXM."], [22000, "On the left, the Additional content toggle lets users send feedback or edit the page title, meta description, or OG tags."], [26000, "In the middle, the URL box always shows the current page. Paste a URL to jump to it."], [28500, "The open origin arrow gives a quick comparison between the origin and the translated site."], [32500, "And at the upper right, the Style Guide and Glossary are there for reference."]],
      [[0, "Part 2: roles and Edit mode."], [4000, "There are two user roles. A Reviewer can send feedback."], [8000, "An Editor can send feedback, and make edits too."], [22000, "Go to the page you want, then switch to Edit mode."], [25000, "Highlight a segment and click it. The panel opens at the bottom of the screen."], [28000, "An Editor clicks in the white box, makes the change, and clicks Save."], [32000, "It's live on the translated site right away, and all identical segments change too."], [35000, "The tabs on the right show Translation Memory, to check how terms were translated before, and the Validator."], [40000, "Want MotionPoint to make the change instead? Use the Feedback tab."], [43500, "Type a comment, suggest a translation, and click Submit. The request goes to MotionPoint."]],
      [[0, "Part 3: the Style Guide and Glossary Manager."], [4000, "Both open from the upper right of Live Edit."], [5500, "The Style Guide tells our linguists the tone for the target market, and how brand-specific items should be translated."], [8000, "The Glossary Manager has the latest glossary. Customers can send feedback on terms at the start of a project, or change existing terms later."], [22000, "Search for a term in the origin or translated language, and select it."], [26000, "Open the Feedback tab, write the request, and click Send."], [40000, "The status is now Open. MotionPoint is notified and starts the change."], [43500, "If MotionPoint has questions, the item goes to Returned. That means we need the customer's input."], [46500, "Once we hear back, we implement it and close it, usually within one to two business days."], [49000, "The feedback tally box filters by status, the History tab shows every change to a term, and the download arrow exports the glossary to Excel."]],
      [[0, "Part 4: the Dashboard."], [4000, "Feedback and edits show up here. The tiles at the top summarize them."], [9000, "Use the filters to focus, and expand an item for details."], [13000, "Customers can reply right there. It's a back-and-forth conversation with MotionPoint."], [22000, "Items that need more input from the customer are placed in Returned status."], [25000, "The customer gets an email for each Returned item, and we wait for their clarification."], [27000, "MotionPoint also offers an approval workflow, if the customer wants one."], [40000, "The Edits tile shows every edit the customer's team made: what it was edited from, and what it was edited to."], [46000, "Anything shown in the Dashboard can be exported to Excel."]],
      [[0, "Part 5: Pages Review."], [4000, "Pages Review lets a team review a set of pages, and captures any feedback and edits made on them."], [7500, "It's usually used at the start of a project to approve sample pages. Customers can also create their own lists for internal review."], [21000, "Use the Actions drop-down, click Add to page reviews, and paste the URLs."], [29000, "Or, from any page, click the Add to page reviews button at the top right."]],
      [[0, "Part 6: helping customers with Live Edit."], [4000, "How do I get access? They ask their CXM to become a Live Edit user."], [7000, "Why can I only send feedback? They have the Reviewer role. Editors can edit."], [10000, "I changed one word and it changed everywhere. Saving an edit changes all identical segments."], [13000, "Why did I get an email about a Returned item? MotionPoint needs their input. They reply in the Dashboard."], [23000, "How long does glossary feedback take? Usually one to two business days."], [26000, "Can I fix the page title or meta description? Yes: toggle Additional content."], [29000, "I need a report of our edits. Dashboard, Edits tile, export to Excel."], [32000, "Can we review sample pages first? Yes: Pages Review."]],
      [[0, "Part 7: practice. What would you do?"], [4000, "A customer can send feedback, but can't edit anything."], [9000, "They have the Reviewer role. Only Editors can make edits. Their CXM can help with roles."], [14000, "An Editor saved a change. When does it show on the site?"], [19000, "Right away. And every identical segment changes too."], [24000, "A customer wants MotionPoint to make the change."], [29000, "Use the Feedback tab: add a comment and a suggested translation, then Submit."], [34000, "A glossary feedback item shows Returned."], [39000, "MotionPoint needs their input. They got an email, and they reply in the Dashboard."], [44000, "The customer wants to fix a page's meta description."], [49000, "Toggle Additional content: the title, meta description and OG tags."], [54000, "Leadership wants a list of all edits made."], [59000, "Dashboard, Edits tile: edited from and to, exported to Excel."], [66000, "Quick recap."], [82000, "Know the tool, so you can guide the customer. Thanks for watching!"]]];
  }
  labels() { return ["Intro", "Around", "Edit", "Glossary", "Dashboard", "Review", "Support", "Practice"]; }

  /* ---------- original background jazz, synthesized live ---------- */
  bars() {
    // [bass walk (MIDI), chord voicing (MIDI)] — ii-V-I in F with turnarounds, 80 bpm swing
    return [
      [[43, 46, 50, 47], [58, 62, 65, 69]], // Gm9
      [[48, 46, 43, 40], [58, 62, 64, 69]], // C13
      [[41, 45, 48, 49], [57, 60, 64, 67]], // Fmaj9
      [[50, 48, 45, 44], [54, 60, 64, 69]], // D9
      [[43, 46, 50, 47], [58, 62, 65, 69]], // Gm9
      [[48, 46, 43, 40], [58, 62, 64, 69]], // C13
      [[45, 48, 52, 51], [60, 64, 67, 71]], // Am9
      [[50, 48, 45, 44], [54, 60, 64, 69]]  // D9
    ];
  }
  hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  initAudio() {
    if (this.ctx) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      const ctx = new AC();
      const master = ctx.createGain();
      master.gain.value = 0;
      master.connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate * 1.0);
      const noise = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      this.ctx = ctx; this.master = master; this.noise = noise;
      this.beat = 0; this.nextT = 0;
      return true;
    } catch (e) { return false; }
  }
  pianoNote(m, t, vel, dur) {
    const c = this.ctx;
    const f = this.hz(m);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(2600, t); lp.frequency.exponentialRampToValueAtTime(900, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vel, t + 0.006);
    g.gain.exponentialRampToValueAtTime(vel * 0.3, t + 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    lp.connect(g); g.connect(this.master);
    [[1, 1], [2, 0.28], [3, 0.08]].forEach((h) => {
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f * h[0];
      const hg = c.createGain(); hg.gain.value = h[1];
      o.connect(hg); hg.connect(lp);
      o.start(t); o.stop(t + dur + 0.05);
    });
  }
  pianoChord(notes, t, vel, dur) {
    notes.forEach((m, i) => this.pianoNote(m, t + i * 0.018, vel, dur));
  }
  tap(t, vol, dur, freq) {
    const c = this.ctx;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  }
  scheduleBeat(i, t) {
    const spb = 60 / 80;
    const sw = spb * 2 / 3;
    const barIx = Math.floor(i / 4) % 8;
    const bar = this.bars()[barIx];
    const b = i % 4;
    this.tap(t, 0.014, 0.25, 7500);
    if (b === 1 || b === 3) {
      this.tap(t + sw, 0.01, 0.18, 7500);
      this.tap(t, 0.012, 0.05, 9500);
    }
    if (b === 0) {
      this.pianoNote(bar[0][0] + 12, t, 0.05, 2.4);
      this.pianoChord(bar[1], t + 0.03, 0.028, 2.2);
    }
    const v = Math.floor(i / 4) % 2;
    if (b === 2 && v === 0) this.pianoChord(bar[1], t + sw, 0.018, 1.2);
    if (b === 1 && v === 1) this.pianoChord(bar[1], t + sw, 0.018, 1.2);
  }
  schedule() {
    const c = this.ctx;
    if (!c || c.state !== 'running' || !this.musicLive) return;
    if (this.nextT < c.currentTime) this.nextT = c.currentTime + 0.05;
    while (this.nextT < c.currentTime + 0.3) {
      this.scheduleBeat(this.beat, this.nextT);
      this.beat = (this.beat + 1) % 32;
      this.nextT += 60 / 80;
    }
  }
  musicStart() {
    if (!this.state.music || !this.initAudio()) return;
    const c = this.ctx;
    try { c.resume(); } catch (e) {}
    if (!this.musicLive) {
      this.musicLive = true;
      this.beat = 0;
      this.nextT = c.currentTime + 0.1;
      this.master.gain.cancelScheduledValues(c.currentTime);
      this.master.gain.setValueAtTime(0.0001, c.currentTime);
      this.master.gain.exponentialRampToValueAtTime(0.55, c.currentTime + 1.5);
    }
  }
  musicStop(fade) {
    if (!this.ctx) return;
    const c = this.ctx;
    this.musicLive = false;
    const now = c.currentTime;
    this.master.gain.cancelScheduledValues(now);
    this.master.gain.setValueAtTime(Math.max(this.master.gain.value, 0.0001), now);
    this.master.gain.exponentialRampToValueAtTime(0.0001, now + (fade || 0.3));
  }
  musicPause() { if (this.ctx) { try { this.ctx.suspend(); } catch (e) {} } }
  musicResume() { if (this.ctx && this.state.music) { try { this.ctx.resume(); } catch (e) {} } }

  componentDidMount() {
    this.iv = setInterval(() => this.tick(), 200);
    this.au = setInterval(() => this.schedule(), 60);
  }
  componentWillUnmount() {
    clearInterval(this.iv); clearInterval(this.au); clearTimeout(this.to);
    if (this.ctx) { try { this.ctx.close(); } catch (e) {} }
  }
  tick() {
    const s = this.state;
    if (!s.playing || s.scene < 0) return;
    const d = this.durs();
    const el = s.el + 200;
    if (el >= d[s.scene]) {
      if (s.scene < d.length - 1) this.setState({ scene: s.scene + 1, el: 0 });
      else { this.setState({ el: d[s.scene], playing: false, ended: true }); this.musicStop(3); }
    } else {
      this.setState({ el: el });
    }
  }
  go(i, off) {
    off = off || 0;
    clearTimeout(this.to);
    this.musicStart();
    this.musicResume();
    this.setState({ scene: -1, el: 0 });
    this.to = setTimeout(() => {
      this.setState({ scene: i, el: off, started: true, playing: true, ended: false });
      if (off) setTimeout(() => this.sync(off), 60);
    }, 40);
  }
  sync(off) {
    try {
      const st = document.querySelector('.stage');
      if (!st || !st.getAnimations) return;
      st.getAnimations({ subtree: true }).forEach((a) => { try { a.currentTime = off; } catch (e) {} });
    } catch (e) {}
  }
  jump(delta) {
    const d = this.durs();
    const s = this.state;
    const cur = s.scene < 0 ? 0 : s.scene;
    let t = 0;
    for (let i = 0; i < cur; i++) t += d[i];
    t += (s.scene < 0 || !s.started) ? 0 : s.el;
    const total = d.reduce((a, b) => a + b, 0);
    t = Math.max(0, Math.min(t + delta, total - 500));
    let i = 0;
    while (i < d.length - 1 && t >= d[i]) { t -= d[i]; i++; }
    this.go(i, t);
  }
  fmt(ms) {
    const t = Math.floor(ms / 1000);
    const m = Math.floor(t / 60);
    const sec = t % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  renderVals() {
    const s = this.state;
    const d = this.durs();
    const total = d.reduce((a, b) => a + b, 0);
    const cur = s.scene < 0 ? 0 : s.scene;
    let done = 0;
    for (let i = 0; i < cur; i++) done += d[i];
    done += s.scene < 0 ? 0 : s.el;
    const vis = s.started ? s.scene : -2;
    const chapters = this.labels().map((label, i) => ({
      label: label,
      cls: s.started && i === cur ? 'on' : (s.started && i < cur ? 'done' : ''),
      go: () => this.go(i)
    }));
    return {
      s0: vis === 0, s1: vis === 1, s2: vis === 2, s3: vis === 3, s4: vis === 4, s5: vis === 5, s6: vis === 6, s7: vis === 7,
      showCover: !s.started,
      pauseCls: s.playing ? '' : 'paused',
      isPlaying: s.playing,
      notPlaying: !s.playing,
      playLabel: s.playing ? 'Pause' : (s.ended ? 'Replay' : 'Play'),
      progressW: (Math.min(1, done / total) * 100).toFixed(2) + '%',
      timeLabel: this.fmt(done) + ' / ' + this.fmt(total),
      chapters: chapters,
      steps: [1, 2, 3, 4, 5, 6, 7].map((n) => ({ n: n, on: s.started && s.scene >= 0 && s.scene === n })),
      showSubs: s.subsOn && s.started,
      subs: (() => {
        const L = s.scene >= 0 ? this.subLines()[s.scene] : [];
        let act = -1;
        L.forEach((c, i) => { if (s.el >= c[0]) act = i; });
        return L.map((c, i) => ({ text: c[1], on: i === act }));
      })(),
      subsOn: s.subsOn,
      subsLabel: s.subsOn ? 'Hide captions' : 'Show captions',
      subsColor: s.subsOn ? '#8FD16F' : '#A9B8CC',
      toggleSubs: () => this.setState({ subsOn: !this.state.subsOn }),
      musicOn: s.music,
      musicOff: !s.music,
      musicLabel: s.music ? 'Music on' : 'Music off',
      toggleMusic: () => {
        const on = !this.state.music;
        this.setState({ music: on }, () => {
          if (!on) this.musicStop(0.6);
          else if (this.state.playing) this.musicStart();
        });
      },
      togglePlay: () => {
        if (!this.state.started || this.state.ended) this.go(0);
        else {
          const playing = !this.state.playing;
          if (playing) this.musicResume(); else this.musicPause();
          this.setState({ playing: playing });
        }
      },
      replay: () => this.go(0),
      back10: () => this.jump(-10000),
      fwd10: () => this.jump(10000),
      prev: () => this.go(Math.max(0, cur - 1)),
      next: () => this.go(Math.min(d.length - 1, cur + 1))
    };
  }
}

Player.prototype.setState = function (obj, cb) { Object.assign(this.state, obj); this.render(); if (cb) cb(); };
Player.prototype.render = function () {
  const v = this.renderVals();
  const $ = (id) => document.getElementById(id);
  const s = this.state;
  const vis = s.started ? s.scene : -2;
  if (vis !== this._vis) {
    this._vis = vis;
    const tpl = $('scene-' + vis);
    $('sceneHost').innerHTML = tpl ? tpl.innerHTML : '';
  }
  $('stage').classList.toggle('paused', !s.playing);
  $('cover').hidden = !v.showCover;
  const st = v.steps.find((x) => x.on);
  const stn = st ? st.n : 0;
  if (stn !== this._step) { this._step = stn; $('steps').innerHTML = stn ? STEP_HTML.split('{{st.n}}').join(String(stn)) : ''; }
  const sb = v.showSubs ? v.subs.find((x) => x.on) : null;
  const key = sb ? s.scene + '|' + sb.text : '';
  if (key !== this._sub) {
    this._sub = key;
    $('subs').innerHTML = '';
    if (sb) { const d = document.createElement('div'); d.innerHTML = SUB_OPEN + '</div>'; d.firstChild.textContent = sb.text; $('subs').appendChild(d.firstChild); }
  }
  $('prog').style.width = v.progressW;
  $('timeLabel').textContent = v.timeLabel;
  $('playLabel').textContent = v.playLabel;
  $('playBtn').setAttribute('aria-label', v.playLabel);
  $('icoPause').hidden = !v.isPlaying; $('icoPlay').hidden = v.isPlaying;
  $('musicLabel').textContent = v.musicLabel; $('musicBtn').setAttribute('aria-label', v.musicLabel); $('musicBtn').setAttribute('aria-pressed', String(v.musicOn));
  $('icoMusicOn').hidden = !v.musicOn; $('icoMusicOff').hidden = v.musicOn;
  $('subsBtn').setAttribute('aria-label', v.subsLabel); $('subsBtn').setAttribute('aria-pressed', String(v.subsOn)); $('subsIcon').setAttribute('stroke', v.subsColor);
  const ck = v.chapters.map((c) => c.cls).join(',');
  if (ck !== this._chips) {
    this._chips = ck;
    const host = $('chapters'); host.innerHTML = '';
    v.chapters.forEach((c, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip ' + c.cls; b.textContent = c.label;
      b.addEventListener('click', () => this.go(i)); host.appendChild(b);
    });
  }
};
const P = new Player();
const call = (k) => () => P.renderVals()[k]();
document.getElementById('coverPlay').addEventListener('click', call('togglePlay'));
document.getElementById('playBtn').addEventListener('click', call('togglePlay'));
document.getElementById('replayBtn').addEventListener('click', call('replay'));
document.getElementById('prevBtn').addEventListener('click', call('prev'));
document.getElementById('back10Btn').addEventListener('click', call('back10'));
document.getElementById('fwd10Btn').addEventListener('click', call('fwd10'));
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') { e.preventDefault(); call('back10')(); } else if (e.key === 'ArrowRight') { e.preventDefault(); call('fwd10')(); } else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); call('togglePlay')(); } });
document.getElementById('nextBtn').addEventListener('click', call('next'));
document.getElementById('musicBtn').addEventListener('click', call('toggleMusic'));
document.getElementById('subsBtn').addEventListener('click', call('toggleSubs'));
P.render();
P.componentDidMount();
